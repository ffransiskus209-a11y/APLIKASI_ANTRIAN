<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk sebagai Petugas - QueueApp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <!-- Navigasi Utama -->
  </header>

  <main id="konten-utama">
    <h1>Masuk sebagai Petugas</h1>
    <p>Halaman ini hanya untuk petugas. Pengunjung tidak perlu masuk.</p>

    <section aria-labelledby="judul-masuk">
      <h2 id="judul-masuk">Kredensial petugas</h2>

      <!-- 1. Tambahkan novalidate di sini -->
      <form id="form-masuk" action="admin-dashboard.html" method="post" novalidate>
        <!-- 2. Wadah pesan kesalahan -->
        <p class="pesan-galat" role="alert" id="pesan-login"></p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </p>

        <button type="submit">Masuk</button>
      </form>
    </section>
  </main>

  <footer>
    <!-- Footer -->
  </footer>

  <!-- 3. Tautkan modul JS di sini -->
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
